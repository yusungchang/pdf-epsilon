[package]
name = "pdf-epsilon"
description = "Make PDFs smaller. Keep what matters."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true

[[bin]]
name = "pdf-epsilon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
epsilon = { path = "../crates/epsilon" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
# Page thumbnails. Runs only in a separate, memory-capped process (see src/render.rs).
hayro = "0.8"

[dev-dependencies]
flate2 = "1"

# Ending the renderer process quietly, and reading its memory use (see src/render.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
