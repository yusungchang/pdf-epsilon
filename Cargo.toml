[workspace]
resolver = "2"
members = ["crates/epsilon", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["yusungchang"]
license = "UNLICENSED"
homepage = "https://pdfepsilon.com"
repository = "https://github.com/yusungchang/pdf-epsilon"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Image decoding and resampling are painfully slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
