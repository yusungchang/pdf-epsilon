[package]
name = "epsilon"
description = "The PDF Epsilon compression engine: make PDFs smaller, keep what matters."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
lopdf = "0.45"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
flate2 = "1"
# Downsampling: the same Lanczos3 filter as the image crate, about four times faster (SIMD).
fast_image_resize = { version = "5", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }

# Reading installed and free memory, to size how many images are worked on at once.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
serde_json = "1"
