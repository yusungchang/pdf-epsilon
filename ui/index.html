<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Epsilon</title>
  <!-- Applies a saved Light or Dark choice before anything is drawn, so there is no flash. -->
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Text comes from locales/<language>.json: data-i18n sets an element's text,
       data-i18n-label its aria-label. Product names are not translated. -->
  <header>
    <div class="brand">
      <img class="mark" src="icon.png" alt="" width="52" height="52">
      <div>
        <h1>PDF Epsilon</h1>
        <p class="tagline" data-i18n="app.tagline"></p>
      </div>
    </div>
    <div class="header-tools">
      <div class="update">
        <button id="update" class="theme-button" type="button" aria-haspopup="dialog" aria-expanded="false"></button>
        <div id="update-menu" class="update-menu" role="dialog" hidden></div>
      </div>
      <div class="theme">
        <button id="theme" class="theme-button" type="button" aria-haspopup="menu" aria-expanded="false"></button>
        <div id="theme-menu" class="theme-menu" role="menu" hidden></div>
      </div>
      <div class="language">
        <button id="language" class="language-button" type="button" aria-haspopup="menu" aria-expanded="false"></button>
        <div id="language-menu" class="language-menu" role="menu" hidden></div>
      </div>
    </div>
  </header>

  <main>
    <button id="drop" class="drop" type="button">
      <span class="drop-title" data-i18n="drop.title"></span>
      <span class="drop-sub" data-i18n="drop.sub"></span>
    </button>

    <p id="notice" class="notice" role="status" hidden></p>

    <nav id="files" class="files" data-i18n-label="files.label" hidden></nav>

    <p id="status" class="status" hidden></p>

    <div id="report" class="report" hidden>
      <section class="summary">
        <div>
          <h2 id="file-name"></h2>
          <p id="file-facts" class="facts"></p>
        </div>
        <div class="file-size">
          <div id="file-bytes" class="big"></div>
          <div class="facts" data-i18n="summary.now"></div>
        </div>
      </section>

      <div id="warnings"></div>

      <section class="card">
        <h3 data-i18n="usage.title"></h3>
        <div id="usage-bar" class="usage-bar" role="img"></div>
        <ul id="usage" class="usage"></ul>
      </section>

      <section class="card">
        <h3 data-i18n="presets.title"></h3>
        <p class="hint" data-i18n="presets.hint"></p>
        <div id="presets" class="presets" role="radiogroup" data-i18n-label="presets.label"></div>
        <p id="preset-note" class="note"></p>
        <div id="breakdown" class="breakdown"></div>

        <details id="advanced">
          <summary data-i18n="advanced.title"></summary>
          <div class="grid">
            <label class="row">
              <input type="checkbox" id="images-on">
              <span data-i18n="advanced.images"></span>
            </label>
            <label class="field">
              <span data-i18n="advanced.resolution"></span>
              <span class="inline"><input type="number" id="dpi" min="36" max="1200" step="1"> <span data-i18n="advanced.dpi"></span></span>
            </label>
            <label class="field">
              <span><span data-i18n="advanced.quality"></span> <output id="quality-out"></output></span>
              <input type="range" id="quality" min="10" max="100" step="1">
            </label>
            <label class="row"><input type="checkbox" id="dedupe"><span data-i18n="advanced.dedupe"></span></label>
            <label class="row"><input type="checkbox" id="subset-fonts"><span data-i18n="advanced.subsetFonts"></span></label>
            <label class="row"><input type="checkbox" id="font-tables"><span data-i18n="advanced.fontTables"></span></label>
            <label class="row"><input type="checkbox" id="thumbs"><span data-i18n="advanced.thumbnails"></span></label>
            <label class="row"><input type="checkbox" id="private"><span><span data-i18n="advanced.editorData"></span> <small data-i18n="advanced.editorDataNote"></small></span></label>
            <label class="row"><input type="checkbox" id="metadata"><span><span data-i18n="advanced.metadata"></span> <small data-i18n="advanced.metadataNote"></small></span></label>
          </div>
        </details>

        <div class="save-row">
          <div class="output">
            <span data-i18n="save.to"></span>
            <button id="out-same" class="link on" type="button" data-i18n="save.nextTo"></button>
            <span class="sep" data-i18n="save.or"></span>
            <button id="out-pick" class="link" type="button"></button>
          </div>
          <div class="save-buttons">
            <button id="save-cancel" class="link" type="button" data-i18n="action.cancel" hidden></button>
            <button id="save-all" class="secondary" type="button" hidden></button>
            <button id="save" class="primary" type="button" data-i18n="save.button"></button>
          </div>
        </div>
        <div id="save-result" class="save-result" hidden></div>
      </section>

      <!-- Details most people don't need before saving: closed until opened, and remembered. -->
      <details id="more" class="extra">
        <summary><span data-i18n="more.title"></span><span class="extra-hint" data-i18n="more.hint"></span></summary>
        <div class="extra-body">
      <section class="card">
        <h3 data-i18n="found.title"></h3>
        <ul id="findings" class="findings"></ul>
      </section>

      <section class="card">
        <div class="pages-head">
          <h3 data-i18n="pages.title"></h3>
          <div class="pages-tools">
            <button id="only-issues" class="icon-btn" type="button" aria-pressed="false" data-icon="issues" data-i18n-label="pages.onlyIssues"></button>
            <button id="largest" class="icon-btn" type="button" aria-pressed="false" data-icon="largest" data-i18n-label="pages.largest"></button>
            <span class="tool-sep" aria-hidden="true"></span>
            <button id="expand-all" class="icon-btn" type="button" data-icon="expand" data-i18n-label="pages.expandAll"></button>
            <button id="collapse-all" class="icon-btn" type="button" data-icon="collapse" data-i18n-label="pages.collapseAll"></button>
          </div>
        </div>
        <div class="page-legend" id="page-legend"></div>
        <div id="pages" class="pages"></div>
        <button id="more-pages" class="link more" type="button" hidden></button>
      </section>
        </div>
      </details>
    </div>
  </main>

  <dialog id="compare" class="compare"></dialog>

  <script src="app.js"></script>
</body>
</html>
